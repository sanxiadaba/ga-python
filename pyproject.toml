[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-python-tsp"
version = "3.0.0"
description = "通用遗传算法引擎与内置的 25 城 TSP 示例"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sanxiadaba" }]
keywords = ["genetic-algorithm", "tsp", "optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[project.urls]
Homepage = "https://github.com/sanxiadaba/ga-python"
Repository = "https://github.com/sanxiadaba/ga-python"
Issues = "https://github.com/sanxiadaba/ga-python/issues"

[project.scripts]
ga-tsp = "ga_tsp.cli:main"

[tool.setuptools.packages.find]
include = ["ga_tsp*"]

[tool.setuptools.package-data]
ga_tsp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ga_tsp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
packages = ["ga_tsp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
# 中文标点是正文的一部分，不按“易混 ASCII”处理。
ignore = ["RUF001", "RUF002", "RUF003"]
