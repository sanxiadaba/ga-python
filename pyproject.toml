[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-python-tsp"
version = "2.0.0"
description = "A reproducible genetic-algorithm experiment for a 25-city TSP"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "sanxiadaba" }]
keywords = ["genetic-algorithm", "tsp", "optimization", "reproducibility"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/sanxiadaba/ga-python"
Repository = "https://github.com/sanxiadaba/ga-python"
Issues = "https://github.com/sanxiadaba/ga-python/issues"

[project.scripts]
ga-tsp = "ga_tsp.main:main"
ga-tsp-experiment = "ga_tsp.experiment:main"

[tool.setuptools.packages.find]
include = ["ga_tsp*"]

[tool.setuptools.package-data]
ga_tsp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ga_tsp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ga_tsp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
