[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["main.py", "ga.py", "tsp.py", "plot.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
# 中文标点是正文的一部分，不按“易混 ASCII”处理。
ignore = ["RUF001", "RUF002", "RUF003"]
